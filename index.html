<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            background-color: white;
            width: 70%;
            margin: 100px auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #2563eb;
            font-size: 40px;
        }

        p {
            color: #555555;
            font-size: 20px;
        }

        .button {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 12px 25px;
            margin-top: 20px;
            text-decoration: none;
            border-radius: 8px;
        }

        .button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Hello, World! 👋</h1>

        <p>Welcome to my GitHub Pages website.</p>

        <p>I am learning HTML, CSS and GitHub.</p>

        <a href="https://github.com/" class="button">
            Visit GitHub
        </a>
    </div>

</body>
</html>
